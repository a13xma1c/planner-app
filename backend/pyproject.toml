[project]
name = "planner"
version = "2.0.0"
description = "A feature-rich personal planner: FastAPI backend, React frontend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "python-dateutil>=3.0.0",
    "pwdlib[argon2]>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "types-python-dateutil",
    "freezegun>=1.5.5",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4",
]

[project.scripts]
planner = "planner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async pitfalls
    "PT",               # pytest style
    "N",                # naming
    "ANN",              # annotations
    "RET",              # return
    "C4",               # comprehensions
]
ignore = [
    "ANN401",  # Any in **kwargs is fine
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # mutable class attrs – SQLAlchemy declarative style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"planner/alembic/**" = ["ANN", "E501", "I001"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["planner/alembic/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:planner.*"]
addopts = "-ra --strict-markers"
markers = ["e2e: end-to-end tests requiring a browser"]

[tool.coverage.run]
source = ["planner"]
omit = ["planner/alembic/*", "planner/__main__.py"]
# sys.monitoring-based core: the classic tracer loses context across SQLAlchemy's
# greenlet switches and under-reports async service coverage.
core = "sysmon"

[tool.coverage.report]
fail_under = 85
show_missing = true
