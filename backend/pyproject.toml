[project]
name = "planner"
version = "2.0.0"
description = "A feature-rich personal planner: FastAPI backend, React frontend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "pwdlib[argon2]>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
    "freezegun>=1.5",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.4",
]

[project.scripts]
planner = "planner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async pitfalls
    "PT",               # pytest style
    "N",                # naming
    "ANN",              # annotations
    "RET",              # return
    "C4",               # comprehensions
]
ignore = [
    "ANN401",  # Any in **kwargs is fine
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # mutable class attrs – SQLAlchemy declarative style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"planner/alembic/**" = ["ANN", "E501", "I001"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["planner/alembic/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:planner.*"]
addopts = "-ra --strict-markers"
markers = ["e2e: end-to-end tests requiring a browser"]

[tool.coverage.run]
source = ["planner"]
omit = ["planner/alembic/*", "planner/__main__.py"]
# sys.monitoring-based core: the classic tracer loses context across SQLAlchemy's
# greenlet switches and under-reports async service coverage.
core = "sysmon"

[tool.coverage.report]
fail_under = 85
show_missing = true
